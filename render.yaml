services:
  - type: cron
    name: crm-daily-backup
    runtime: node
    schedule: "0 22 * * *"  # 22:00 UTC = חצות ישראל (שעון חורף)
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx scripts/daily-backup.ts
    plan: starter  # Cron jobs דורשים plan בתשלום (מינימום $1/חודש)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString

  - type: web
    name: crm-cloud
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build && (cp -r public .next/standalone/ 2>/dev/null || true) && (cp -r .next/static .next/standalone/.next/static) && npm run db:seed
    startCommand: cd .next/standalone && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://crm.landing-p.co.il
    healthCheckPath: /api/health

databases:
  - name: crm-db
    databaseName: crm
    plan: free
